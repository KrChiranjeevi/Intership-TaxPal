<div class="ai-assistant-wrapper">

  <!-- ── FLOATING BUBBLE BUTTON ──────────────────────────────────── -->
  <button class="ai-bubble" id="ai-bubble-btn"
    [class.open]="isOpen"
    (click)="toggleChat()"
    aria-label="Open AI Financial Assistant">
    <span class="bubble-icon" *ngIf="!isOpen">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="currentColor"/>
      </svg>
    </span>
    <span class="bubble-icon close-icon" *ngIf="isOpen">
      <span class="material-icons">close</span>
    </span>
    <span class="bubble-pulse"></span>
  </button>

  <!-- ── CHAT WINDOW ─────────────────────────────────────────────── -->
  <div class="ai-chat-window" [class.visible]="isOpen" role="dialog" aria-label="AI Financial Assistant">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">
          <span class="material-icons">smart_toy</span>
        </div>
        <div class="chat-info">
          <span class="chat-title">TaxPal AI</span>
          <span class="chat-status">Financial Assistant</span>
        </div>
      </div>
      <div class="chat-header-actions">
        <button class="hdr-btn" (click)="clearChat()" title="Clear chat" aria-label="Clear chat">
          <span class="material-icons">delete_outline</span>
        </button>
        <button class="hdr-btn" (click)="toggleChat()" aria-label="Close chat">
          <span class="material-icons">keyboard_arrow_down</span>
        </button>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="chat-messages" #messagesContainer>

      <!-- Suggestion chips (shown when only welcome message) -->
      <div class="suggestion-chips" *ngIf="messages.length <= 1">
        <p class="suggestion-label">Try asking:</p>
        <button class="chip" *ngFor="let s of suggestions" (click)="onSuggestionClick(s)">
          {{ s }}
        </button>
      </div>

      <!-- Messages -->
      <div *ngFor="let msg of messages" class="msg-wrap" [class.user-wrap]="msg.role === 'user'">
        <!-- Bot avatar -->
        <div class="msg-avatar bot-avatar" *ngIf="msg.role === 'model'">
          <span class="material-icons">smart_toy</span>
        </div>

        <!-- Bubble -->
        <div class="msg-bubble" [class.user-bubble]="msg.role === 'user'" [class.bot-bubble]="msg.role === 'model'">
          <!-- Bot: render markdown -->
          <div *ngIf="msg.role === 'model'" class="md-content" [innerHTML]="msg.htmlContent || msg.text"></div>
          <!-- User: plain text -->
          <span *ngIf="msg.role === 'user'">{{ msg.text }}</span>

          <!-- Copy button for bot -->
          <button *ngIf="msg.role === 'model'" class="copy-btn" (click)="copyMessage(msg.text)" title="Copy">
            <span class="material-icons">content_copy</span>
          </button>
        </div>
      </div>

      <!-- Typing indicator -->
      <div class="msg-wrap typing-wrap" *ngIf="isTyping">
        <div class="msg-avatar bot-avatar">
          <span class="material-icons">smart_toy</span>
        </div>
        <div class="msg-bubble bot-bubble typing-bubble">
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
          <span class="typing-dot"></span>
        </div>
      </div>

      <!-- Error -->
      <div class="chat-error" *ngIf="errorMessage">
        <span class="material-icons">error_outline</span>
        {{ errorMessage }}
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <input #inputEl
        type="text"
        class="chat-input"
        placeholder="Ask about your finances..."
        [(ngModel)]="userInput"
        (keydown)="onKeyDown($event)"
        [disabled]="isTyping"
        maxlength="500"
        aria-label="Chat message input">

      <!-- Voice input -->
      <button *ngIf="hasVoice" class="icon-btn voice-btn"
        [class.listening]="isListening"
        (click)="toggleVoice()"
        [title]="isListening ? 'Stop listening' : 'Voice input'"
        [attr.aria-label]="isListening ? 'Stop voice input' : 'Start voice input'">
        <span class="material-icons">{{ isListening ? 'mic' : 'mic_none' }}</span>
      </button>

      <!-- Send -->
      <button class="icon-btn send-btn"
        (click)="sendMessage()"
        [disabled]="!userInput.trim() || isTyping"
        aria-label="Send message">
        <span class="material-icons">send</span>
      </button>
    </div>
  </div>

</div>
